<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <!-- iOS reads this, not the manifest's icons array — without it the home-screen tile is a
         screenshot of the page. Both are generated by scripts/make-icons.js. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Same colour as --play-bg and the manifest's background_color, so the tile, the launch
         screen and the app's first painted pixel are one continuous dark. -->
    <meta name="theme-color" content="#16161a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />
    <title>Kanto Pokédex</title>
    <!-- Fonts are self-hosted (see src/fonts.css, generated by scripts/fetch-fonts.js).
         No third-party requests: the play app has to render correctly offline. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
